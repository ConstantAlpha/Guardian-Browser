<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian — Safe Browsing</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/guardian/manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Guardian">
    <link rel="apple-touch-icon" href="/guardian/icon-192x192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #202124;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 32px;
            width: 100%;
            max-width: 460px;
            text-align: center;
        }
        .shield { font-size: 56px; line-height: 1; }
        h1 { font-size: 28px; margin: 12px 0 4px; color: #0d47a1; }
        .tagline { color: #5f6368; font-size: 14px; margin-bottom: 24px; }
        .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="url"] {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #1a73e8; }
        button {
            padding: 12px 20px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1557b0; }
        button:disabled { background: #9aa0a6; cursor: not-allowed; }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #5f6368;
            padding: 12px;
            background: #f1f3f4;
            border-radius: 8px;
            margin-top: 16px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #fbbc04;
            animation: pulse 1.5s infinite;
        }
        .dot.ready { background: #34a853; animation: none; }
        .dot.error { background: #ea4335; animation: none; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .install-btn {
            background: transparent;
            color: #1a73e8;
            border: 2px solid #1a73e8;
            margin-top: 16px;
            display: none;
        }
        .install-btn:hover { background: #e8f0fe; }
        .result {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }
        .result.blocked { color: #ea4335; }
        .result.safe { color: #34a853; }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield">🛡️</div>
        <h1>Guardian</h1>
        <p class="tagline">Your shield against harmful sites and ads</p>

        <div class="input-row">
            <input type="url" id="urlInput" placeholder="Enter a URL to check…" autocomplete="off">
            <button id="goBtn" onclick="checkAndNavigate()">Check</button>
        </div>

        <p id="result" class="result"></p>

        <div class="status" id="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Loading blocklists…</span>
        </div>

        <button class="install-btn" id="installBtn" onclick="installApp()">📲 Install Guardian</button>
    </div>

    <script>
        // --- Register Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/guardian/sw.js', { scope: '/guardian/' })
                    .then(reg => console.log('Guardian SW registered:', reg.scope))
                    .catch(err => console.error('SW registration failed:', err));
            });

            // Listen for status messages from the service worker
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data && event.data.type === 'STATUS') {
                    updateStatus(event.data.status, event.data.count);
                }
            });
        }

        function updateStatus(state, count) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'dot ' + state;
            if (state === 'ready') {
                text.textContent = `Protection active — ${count.toLocaleString()} domains blocked`;
            } else if (state === 'error') {
                text.textContent = 'Failed to load blocklists';
            } else {
                text.textContent = 'Loading blocklists…';
            }
        }

        // --- Check URL locally & navigate ---
        async function checkAndNavigate() {
            const input = document.getElementById('urlInput');
            const resultEl = document.getElementById('result');
            const goBtn = document.getElementById('goBtn');
            let raw = input.value.trim();

            if (!raw) return;
            // Add https:// if the user typed a bare domain
            if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;

            let url;
            try {
                url = new URL(raw);
            } catch {
                resultEl.textContent = 'Invalid URL';
                resultEl.className = 'result blocked';
                return;
            }

            resultEl.textContent = 'Checking…';
            resultEl.className = 'result';
            goBtn.disabled = true;

            try {
                // Ask the service worker to verify (works offline once cached)
                const sw = navigator.serviceWorker.controller;
                if (sw) {
                    const channel = new MessageChannel();
                    const verdict = await new Promise(resolve => {
                        channel.port1.onmessage = e => resolve(e.data.blocked);
                        sw.postMessage({ type: 'CHECK_URL', hostname: url.hostname }, [channel.port2]);
                    });
                    if (verdict) {
                        resultEl.textContent = '🚫 Blocked — harmful site';
                        resultEl.className = 'result blocked';
                        goBtn.disabled = false;
                        return;
                    }
                }

                resultEl.textContent = '✅ Safe — opening…';
                resultEl.className = 'result safe';
                // Navigating will trigger the SW fetch handler as a second check
                window.location.href = url.href;
            } catch (err) {
                console.error(err);
                resultEl.textContent = 'Check failed — try again';
                resultEl.className = 'result blocked';
                goBtn.disabled = false;
            }
        }

        // Allow Enter key
        document.getElementById('urlInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') checkAndNavigate();
        });

        // --- Install prompt ---
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-block';
        });

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installBtn').style.display = 'none';
            });
        }

        window.addEventListener('appinstalled', () => {
            document.getElementById('installBtn').style.display = 'none';
        });
    </script>
</body>
</html>
