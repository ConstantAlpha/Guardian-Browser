<!-- blocked.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Restricted</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
        <div class="text-5xl mb-4">🛡️</div>
        <h1 id="heading-title" class="text-2xl font-bold mb-2">Content Blocked</h1>
        <p class="text-slate-400 text-sm mb-6">
            Access to this resource has been blocked by your <span class="text-sky-400 font-semibold">Content Shield</span> preferences.
        </p>

        <div class="bg-slate-800/50 border border-slate-700/50 p-4 rounded-xl text-sm italic text-slate-300 mb-6" id="quote">
            "Focus is a muscle. Every time you resist distraction, it gets stronger."
        </div>

        <button onclick="window.history.back()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-5 py-2 rounded-xl text-sm transition">
            Go Back to Safety
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');
        const site = urlParams.get('site');

        if (category) {
            document.getElementById('heading-title').textContent = `${category} Blocked`;
        }
    </script>
</body>
</html>
