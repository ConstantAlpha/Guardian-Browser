<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus & Content Shield</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 w-80 p-4 font-sans select-none">
    
    <h1 class="text-base font-bold mb-3 flex items-center justify-between">
        <span>🛡️ Content Shield</span>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">Active</span>
    </h1>

    <!-- Protection Toggles -->
    <div class="space-y-2 mb-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 text-sm">
        <label class="flex items-center justify-between cursor-pointer">
            <span>🚫 Block Ads & Trackers</span>
            <input type="checkbox" id="toggle-ads" class="accent-sky-500 w-4 h-4" checked>
        </label>
        <label class="flex items-center justify-between cursor-pointer">
            <span>🔞 Block Adult Content</span>
            <input type="checkbox" id="toggle-adult" class="accent-sky-500 w-4 h-4" checked>
        </label>
        <label class="flex items-center justify-between cursor-pointer">
            <span>🎲 Block Gambling Ads/Sites</span>
            <input type="checkbox" id="toggle-gambling" class="accent-sky-500 w-4 h-4" checked>
        </label>
    </div>

    <!-- Custom Add Form -->
    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Custom Site Blocklist</div>
    <form id="add-form" class="flex gap-2 mb-3">
        <input 
            type="text" 
            id="site-input" 
            placeholder="e.g. twitter.com" 
            class="flex-1 bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-sky-500"
            required
        >
        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
            Add
        </button>
    </form>

    <!-- Custom List UI -->
    <ul id="site-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
        <li class="text-slate-500 text-xs text-center py-2">No custom sites added.</li>
    </ul>

    <script>
        const toggleAds = document.getElementById('toggle-ads');
        const toggleAdult = document.getElementById('toggle-adult');
        const toggleGambling = document.getElementById('toggle-gambling');
        const form = document.getElementById('add-form');
        const input = document.getElementById('site-input');
        const siteList = document.getElementById('site-list');

        // Load states
        chrome.storage.local.get(['toggles', 'blockedSites'], (data) => {
            const toggles = data.toggles || { ads: true, adult: true, gambling: true };
            toggleAds.checked = toggles.ads;
            toggleAdult.checked = toggles.adult;
            toggleGambling.checked = toggles.gambling;
            loadCustomSites(data.blockedSites || []);
        });

        // Save toggle changes
        function saveToggles() {
            const toggles = {
                ads: toggleAds.checked,
                adult: toggleAdult.checked,
                gambling: toggleGambling.checked
            };
            chrome.storage.local.set({ toggles });
        }

        toggleAds.addEventListener('change', saveToggles);
        toggleAdult.addEventListener('change', saveToggles);
        toggleGambling.addEventListener('change', saveToggles);

        // Render Custom List
        function loadCustomSites(sites) {
            if (sites.length === 0) {
                siteList.innerHTML = `<li class="text-slate-500 text-xs text-center py-2">No custom sites added.</li>`;
                return;
            }
            siteList.innerHTML = sites.map((site, index) => `
                <li class="flex justify-between items-center bg-slate-800 px-2.5 py-1 rounded text-xs">
                    <span class="truncate max-w-[190px]">${site}</span>
                    <button onclick="removeSite(${index})" class="text-rose-400 hover:text-rose-300 font-bold ml-2">✕</button>
                </li>
            `).join('');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            chrome.storage.local.get(['blockedSites'], (data) => {
                const sites = data.blockedSites || [];
                if (!sites.includes(val)) {
                    sites.push(val);
                    chrome.storage.local.set({ blockedSites: sites }, () => {
                        input.value = '';
                        loadCustomSites(sites);
                    });
                }
            });
        });

        window.removeSite = function(index) {
            chrome.storage.local.get(['blockedSites'], (data) => {
                const sites = data.blockedSites || [];
                sites.splice(index, 1);
                chrome.storage.local.set({ blockedSites: sites }, () => {
                    loadCustomSites(sites);
                });
            });
        };
    </script>
</body>
</html>
